name: Deploy Beiz website
# Publishes the committed site files as they are. No build-time rewriting.
# Only the Claude session that owns the site pushes to main (Purav, 14 Nov 2026).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: beiz-production-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy published files
        run: |
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          out = pathlib.Path('_publish'); out.mkdir()
          skip_top = {'src', 'scripts', 'docs', '_archive', 'notes', 'node_modules', 'preview'}
          keep = {'.html','.css','.js','.svg','.png','.jpg','.jpeg','.webp','.gif','.ico','.woff','.woff2','.ttf','.csv','.json','.txt','.xml','.pdf','.mp4','.webm'}
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name: continue
              p = pathlib.Path(name)
              if any(x.startswith('.') for x in p.parts) or p.parts[0] in skip_top: continue
              if p.name != 'CNAME' and p.suffix.lower() not in keep: continue
              f = out / p; f.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(p, f)
          assert (out / 'CNAME').read_text().strip() == 'beiz.com.au'
          assert (out / 'index.html').exists()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
