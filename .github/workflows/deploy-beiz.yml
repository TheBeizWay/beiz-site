name: Deploy Beiz website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: beiz-production-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the committed static website
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          root = pathlib.Path('.')
          dest = root / '_publish'
          dest.mkdir()
          excluded = {'.github', 'src', 'scripts', 'docs', '_archive', 'node_modules', 'preview'}
          extensions = {'.html', '.css', '.js', '.svg', '.png', '.jpg', '.jpeg', '.webp', '.gif', '.ico', '.woff', '.woff2', '.ttf', '.csv', '.json', '.txt', '.xml', '.pdf', '.mp4', '.webm'}
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not name:
                  continue
              p = pathlib.Path(name)
              if any(part.startswith('.') for part in p.parts) or p.parts[0] in excluded:
                  continue
              if p.name != 'CNAME' and p.suffix.lower() not in extensions:
                  continue
              if p.is_symlink() or not p.is_file():
                  continue
              target = dest / p
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, target)
          home = (dest / 'index.html').read_text()
          if 'Make your finance workflow work.' not in home or 'purav-mehta-2.jpg' in home:
              raise SystemExit('Release blocked: unexpected homepage or portrait reference')
          if (dest / 'CNAME').read_text().strip() != 'beiz.com.au':
              raise SystemExit('Release blocked: custom domain mismatch')
          (dest / '.nojekyll').touch()
          (dest / 'release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'repository': os.environ['GITHUB_REPOSITORY']}))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload production files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public release
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['GITHUB_SHA']
          last_error = ''
          for attempt in range(12):
              try:
                  url = f'https://beiz.com.au/release.json?commit={sha}&attempt={attempt}'
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Beiz-release-verification'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      release = json.load(response)
                  req = urllib.request.Request(f'https://beiz.com.au/?release={sha}&attempt={attempt}', headers={'Cache-Control': 'no-cache', 'User-Agent': 'Beiz-release-verification'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      home = response.read().decode('utf-8')
                  if release.get('commit') == sha and 'Make your finance workflow work.' in home and 'purav-mehta-2.jpg' not in home:
                      print('Verified public release:', sha)
                      break
                  last_error = 'Public release marker or homepage does not match'
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(10)
          else:
              raise SystemExit('Deployment attempted but public verification failed: ' + last_error)
          PY
