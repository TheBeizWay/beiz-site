name: Deploy Beiz website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: beiz-production-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the shared editorial site
        run: python scripts/build_editorial.py _publish
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify served release
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['GITHUB_SHA']
          error = ''
          for attempt in range(12):
              try:
                  def get(path):
                      req = urllib.request.Request('https://beiz.com.au' + path + '?release=' + sha + '&attempt=' + str(attempt), headers={'Cache-Control':'no-cache','User-Agent':'Beiz-release-verification'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return r.read().decode('utf-8')
                  release = json.loads(get('/release.json'))
                  home = get('/')
                  work = get('/services/')
                  tools = get('/tools/')
                  if release.get('commit') == sha and release.get('design') == 'editorial-v1' and all('data-design="editorial-v1"' in s for s in [home,work,tools]) and 'ca-logo-vertical.svg' in home:
                      print('Verified editorial release:', sha)
                      break
                  error = 'Served release does not match'
              except Exception as exc:
                  error = str(exc)
              time.sleep(10)
          else:
              raise SystemExit(error)
          PY
