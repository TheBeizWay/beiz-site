name: markets
on:
  schedule:
    # Every 30 min, 22:00-07:59 UTC = ASX trading day in AEST and AEDT, Sun-Fri UTC (Mon-Fri Sydney)
    - cron: '7,37 22-23 * * 0-4'
    - cron: '7,37 0-7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: markets
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/markets.mjs
      - name: Commit if changed
        run: |
          git config user.name "beiz-bot"
          git config user.email "hello@beiz.com.au"
          git add data/markets.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: market levels"
          git pull --rebase origin main
          git push origin HEAD:main
